<svg xmlns="http://www.w3.org/2000/svg" width="820" height="171" viewBox="0 0 820 171" role="img" aria-label="8 motors coaxial X8 on four arms, single seat. ~176 kg P1 empty weight. The learning machine. Flies first. Weight is not a constraint. ~124 kg P2 empty weight. The low-cost lightweight one, in the Part 103 ultralight lane."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="171" rx="10"/></clipPath><rect width="265.3" height="171" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="170" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="50" font-size="36" font-weight="800" fill="#d9fbe8">8 motors</text><text x="135" text-anchor="middle" y="79" font-size="17" font-weight="600" fill="#ffffff">coaxial X8 on four arms,</text><text x="135" text-anchor="middle" y="102" font-size="17" font-weight="600" fill="#ffffff">single seat</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="171" rx="10"/></clipPath><rect width="265.3" height="171" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="170" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="50" font-size="36" font-weight="800" fill="#fff3c4">~176 kg</text><text x="135" text-anchor="middle" y="79" font-size="17" font-weight="600" fill="#ffffff">P1 empty weight</text><text x="135" text-anchor="middle" y="107" font-size="17" font-weight="500" fill="#f2f5fa">The learning machine. Flies</text><text x="135" text-anchor="middle" y="131" font-size="17" font-weight="500" fill="#f2f5fa">first. Weight is not a</text><text x="135" text-anchor="middle" y="155" font-size="17" font-weight="500" fill="#f2f5fa">constraint.</text></g><g transform="translate(554.7,0)"><clipPath id="c0_2"><rect width="265.3" height="171" rx="10"/></clipPath><rect width="265.3" height="171" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="264.3" height="170" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="50" font-size="36" font-weight="800" fill="#d9fbe8">~124 kg</text><text x="135" text-anchor="middle" y="79" font-size="17" font-weight="600" fill="#ffffff">P2 empty weight</text><text x="135" text-anchor="middle" y="107" font-size="17" font-weight="500" fill="#f2f5fa">The low-cost lightweight one,</text><text x="135" text-anchor="middle" y="131" font-size="17" font-weight="500" fill="#f2f5fa">in the Part 103 ultralight</text><text x="135" text-anchor="middle" y="155" font-size="17" font-weight="500" fill="#f2f5fa">lane.</text></g></g></svg>
